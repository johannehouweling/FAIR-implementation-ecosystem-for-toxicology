name: Data refresh

# Three times a day: read back the curation sheet row by row, then the FAIRsharing Toxicology collection with the
# repository owner's FAIRsharing login (Actions secrets FAIRSHARING_LOGIN and FAIRSHARING_PASSWORD), searching
# FAIRsharing for every row not yet checked against it, and the toxicology FIPs' nanopublications. What changed (edits
# made in the sheet, new collection members, FAIRsharing checks, new resources and links from the FIP declarations)
# goes into one pull request on the branch data-refresh, updated on each run until a person
# merges it. A sheet row or relation with a problem waits in the sheet and is listed in the pull request; only a sheet
# that cannot be read stops the run. The sheet is exported with a Google service account that can only view it
# (secret GOOGLE_CREDENTIALS); setting the secret SHEET_ID switches this on. Nothing is pushed to main; the dashboard
# is redeployed after the pull request is merged. Each run keeps the exported sheet and the FIP ontology it read for
# 90 days.

on:
  schedule:
    - cron: '17 5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # The sheet first, while its row versions still match the committed dataset.
      - id: google
        if: env.SHEET_ID
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          create_credentials_file: false
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Read the curation sheet back
        if: env.SHEET_ID
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          ROUND: curation sheet ${{ steps.day.outputs.day }}
        run: |
          curl -fsS --create-dirs -o build/curation-sheet.xlsx -H "Authorization: Bearer $TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$SHEET_ID/export?mimeType=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          uv run fairtox ingest build/curation-sheet.xlsx --round "$ROUND" --report build/refresh.md
      - name: Keep the exported sheet and the FIP ontology with the run
        if: always() && env.SHEET_ID
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curation-sheet
          path: |
            build/curation-sheet.xlsx
            build/fip/fip-ontology.ttl
          retention-days: 90
          if-no-files-found: ignore
      - name: Read FAIRsharing
        env:
          FAIRSHARING_LOGIN: ${{ secrets.FAIRSHARING_LOGIN }}
          FAIRSHARING_PASSWORD: ${{ secrets.FAIRSHARING_PASSWORD }}
        run: uv run fairtox fairsharing --apply --report build/refresh.md
      - name: Read the FIPs
        run: uv run fairtox fip --apply
      # Pull requests opened with the workflow token do not trigger CI, so test here.
      - run: uv run python -m unittest discover -s tests
      - run: uv run fairtox validate
      - name: Open or update the pull request if the dataset changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: data
          branch: data-refresh
          delete-branch: true
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit-message: 'fix(data): refresh ${{ steps.day.outputs.day }}'
          title: Data refresh ${{ steps.day.outputs.day }}
          body-path: build/refresh.md
      - name: Show the report
        if: always()
        run: if [ -f build/refresh.md ]; then cat build/refresh.md >> "$GITHUB_STEP_SUMMARY"; fi
