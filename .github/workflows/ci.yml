name: CI

# Tests and validates every push and pull request. On main it builds the public dashboard and publishes it to the
# public repository johannehouweling/FAIR-implementation-ecosystem-toxicology-timeline (GitHub Pages), using the deploy key SITE_DEPLOY_KEY.
# The build reads FAIRsharing, with the Actions secrets FAIRSHARING_LOGIN and FAIRSHARING_PASSWORD, in full once a
# day (later runs reuse the day's cache; a pull request reuses the last one of any day), and the FIP declarations; a
# weekly run rebuilds main so the page has the current ones. A build of main that has started is
# never cancelled, so every published build stays in the history of the dashboard repository.
# After a green build of a push to main, release-please keeps a release pull request open with the next version and
# its CHANGELOG.md entry, made from the Conventional Commits since the last release; merging it tags the version and
# publishes a GitHub release.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run fairtox validate --strict
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Keep the day's FAIRsharing records for later runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fairsharing
          key: fairsharing-${{ steps.day.outputs.day }}
          restore-keys: fairsharing-
      - name: Build the dashboard
        env:
          FAIRSHARING_LOGIN: ${{ secrets.FAIRSHARING_LOGIN }}
          FAIRSHARING_PASSWORD: ${{ secrets.FAIRSHARING_PASSWORD }}
          # a pull request publishes nothing, so it builds from the last FAIRsharing records kept, of any day
          FAIRSHARING_CACHE_ANY_DAY: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: uv run fairtox site build/site
      - name: Check the dataset against the CDIF Discovery profile 1.1
        # CODATA's own SHACL shapes (doc-corediscovery v1.1.1, pinned by commit); warnings are recommendations
        run: >-
          uvx --from pyshacl==0.40.1 pyshacl --advanced --allow-warnings --data-file-format json-ld
          --shacl https://raw.githubusercontent.com/Cross-Domain-Interoperability-Framework/doc-corediscovery/a50ccb0c1fe5bef7d1a34f66fdd3affa24590d8d/discoveryDocRules.shacl
          build/site/fair-tox-ecosystem.jsonld
      - name: Read back the links that resolved in earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: links-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: links-
      - name: Check that the links in the dataset and the documentation resolve
        # Every link in the dataset (homepages, sources, creators, terms, notes) and in the documentation. A dead link
        # fails a build of main, so nothing is published with it; a pull request only shows it, as sites come and go.
        # A link that resolved in the last seven days is not requested again (lychee's cache, kept between runs), so
        # a site that is down or slow for a while does not stop a build. A link that fails is never kept: every run
        # requests it again until it resolves.
        # Links the build adds come from live registries and are not checked. Requests carry a browser's Accept
        # header; a redirect page without a Location header counts as reached, and 403 or 429 means a site blocks
        # robots or rate-limits, not that the link is dead. Left out: FAIRsharing, whose records (also by their DOIs,
        # 10.25504/...) need a login and which asked for at most one request every 8 to 12 seconds; the dataset's
        # own w3id.org identifiers until that namespace is registered; the Wayback Machine, which throttles bursts
        # of requests and whose snapshots do not go away; and sites that answer no automated client: apvma.gov.au,
        # fda.gov (404 to GitHub's runners only), canada.ca (resets HTTP/2 connections), aop-networkfinder.no (its
        # certificate chain lacks its intermediate, which browsers fetch but lychee does not), ega-archive.org and
        # proconsortium.org (intermittent connection failures), and one Europe PMC full-text endpoint that
        # intermittently returns HTTP 500.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 8 --max-retries 2 --timeout 30 --cache --max-cache-age 7d
            --accept 200..=299,300..=399,403,429 --header 'Accept: text/html, */*;q=0.1'
            --exclude fairsharing.org --exclude doi.org/10.25504 --exclude w3id.org/fair-tox --exclude web.archive.org
            --exclude apvma.gov.au --exclude fda.gov --exclude canada.ca --exclude aop-networkfinder.no
            --exclude ega-archive.org --exclude proconsortium.org
            --exclude ebi.ac.uk/europepmc/webservices/rest/PMC1241500/fullTextXML
            data/fair-tox-ecosystem.jsonld README.md docs/*.md
      - name: Keep the links that resolved for later runs
        # also after a failed check, so that the next run requests only the links that failed
        if: ${{ !cancelled() && hashFiles('.lycheecache') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: links-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check out the public dashboard repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johannehouweling/FAIR-implementation-ecosystem-toxicology-timeline
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: dashboard
      - name: Publish the dashboard
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          rsync -a --delete --exclude .git --exclude README.md --exclude LICENSE --exclude .nojekyll build/site/ dashboard/
          cp LICENSE-DATA dashboard/LICENSE   # the CC BY-SA 4.0 text verbatim, so GitHub detects the licence
          cd dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The dashboard did not change."; exit 0; fi
          git commit -m "chore(site): publish the dashboard built from ${GITHUB_SHA::7}"
          git push
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
