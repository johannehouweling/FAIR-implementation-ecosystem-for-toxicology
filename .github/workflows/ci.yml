name: CI

# Tests and validates every push and pull request. On main it builds the public dashboard and publishes it to the
# public repository johannehouweling/fair-tox-dashboard (GitHub Pages), using the deploy key SITE_DEPLOY_KEY.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run fairtox validate
      - run: uv run fairtox site build/site
      - name: Check out the public dashboard repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johannehouweling/fair-tox-dashboard
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: dashboard
      - name: Publish the dashboard
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          rsync -a --delete --exclude .git --exclude README.md --exclude LICENSE --exclude .nojekyll build/site/ dashboard/
          cd dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The dashboard did not change."; exit 0; fi
          git commit -m "Update the dashboard"
          git push
